<!DOCTYPE html>
<html>
    <head>
        <meta charset = "UTF-8">
        <style>
            body {
                width: 400px;
                padding: 15px;
                font-family: -apple-syste, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
                margin: 0.5;
            }
            h1 {
                font-size: 18px;
                margin: 0 0 0 0;
                color:cadetblue;
            }
            textarea {
                width: 100%;
                min-height: 120px;
                padding: 8px;
                border: 1px solid #ddd;
                border-radius: 4px;
                font-family: inherit;
                resize: vertical;
                box-sizing: border-box;
            }
            button {
                width: 100%;
                padding: 10px;
                background: darkseagreen;
                color: black;
                border: none;
                border-radius: 4px;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                margin-top: 12px;
            }
            button:hover {
                background:rgb(80, 129, 80)
            }
            button:disabled {
                background: #ccc;
                cursor: not-allowed;
            }
            .error {
                color: #d32f2f;
                font-size: 13px;
                margin-top: 8px;
            }
            .results {
                margin-top: 16px;
                padding-top: 16px;
                border-top: 1px solid #eee;
            }
            .score {
                font-size: 32px;
                font-weight: bold;
                color:slateblue;
                text-align: center;
                margin: 12px 0;
            }
            .score-label {
                text-align: center;
                color: #666;
                font-size: 14px;
                margin-bottom: 16px;
            }
            .explanation {
                font-size: 13px;
                line-height: 1.6;
                color: #333;
            }
            .explanation h3 {
                font-size: 14px;
                margin: 12px 0 8px 0;
                color:darkslateblue;
            }
            .explanation ul {
                margin: 4px 0;
                padding-left: 20px;
            }
            .explanation li {
                margin: 4px 0;
            }
            .loading {
                text-align: center;
                color: #666;
                padding: 20px;
            }
            label {
                display: block;
                font-size: 13px;
                font-weight: 600;
                margin-bottom: 6px;
                color: #333;
            }
        </style>
    </head>
    <body>
        <h1> LinkedIn Candidate Matcher </h1>
        <div id = "input-section">
            <label for = "jobDesc"> Job Description:</label>
            <textarea id = "jobDesc" placeholder="Paste the job description here..."></textarea>
            <button id = "analyzeBtn">Analyze Match</button>
            <div id="error" class="error"></div>
        </div>

        <div id = "results" class="results" style="display:none;">
            <div class="score" id="score"></div>
            <div class="score-label">Match Score</div>
            <div class="explanation" id="explanation"></div>
        </div>

        <div id="loading" class="loading" style="display: none;">
            Analyzing profile...
        </div>

        <script src="popup.js"></script>
    </body>
</html>
